<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sender Dashboard - ZigaSwift</title>
<link rel="stylesheet" href="styles.css" /> <!-- Reuse your main styles if possible -->
<style>
body { background: #0b1220; color: #e7eefc; font-family: system-ui, sans-serif; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
h1 { margin: 0; }
.btn { padding: 10px 20px; background: #2b76ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
.btn:hover { background: #1f5ed8; }
.section { background: #121a2c; border: 1px solid #22304f; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.request-form label { display: block; margin: 12px 0 6px; color: #9ab0d6; }
.request-form input, .request-form select, .request-form textarea { width: 100%; padding: 12px; background: #0e1628; border: 1px solid #22304f; border-radius: 8px; color: white; }
.matches-grid { display: grid; gap: 16px; }
.match-card { background: #1a2742; padding: 16px; border-radius: 8px; border: 1px solid #22304f; }
.match-card h3 { margin: 0 0 8px; color: #3ddc97; }
.match-card button { margin-top: 12px; padding: 8px 16px; background: #1f9d67; color: white; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Sender Dashboard</h1>
<div>
<button class="btn" id="logout">Logout</button>
</div>
</header>

<!-- Request a new shipment -->
<section class="section">
<h2>Request New Delivery</h2>
<form class="request-form" id="requestForm">
<label>Pickup Location</label>
<input type="text" id="pickup" placeholder="e.g. Houston, TX" required />

<label>Dropoff Location</label>
<input type="text" id="dropoff" placeholder="e.g. Lagos, Nigeria" required />

<label>Weight (kg)</label>
<input type="number" id="weight" step="0.1" min="0.1" placeholder="e.g. 15" required />

<label>Priority</label>
<select id="priority">
<option value="standard">Standard</option>
<option value="express">Express</option>
<option value="rush">Rush</option>
</select>

<label>Contents Description</label>
<textarea id="contents" rows="3" placeholder="Describe what you're sending..." required></textarea>

<label>Declared Value ($)</label>
<input type="number" id="value" step="0.01" min="0" placeholder="e.g. 250" required />

<button type="submit" class="btn">Submit Request & Find Matches</button>
</form>
</section>

<!-- Matched couriers (will populate after request) -->
<section class="section">
<h2>Available Couriers</h2>
<div class="matches-grid" id="matchesList">
<!-- Matches will appear here as cards -->
<p>No matches yet. Submit a request above.</p>
</div>
</section>
</div>

<script>
// Basic logout
document.getElementById('logout').addEventListener('click', () => {
localStorage.removeItem('jwtToken');
window.location.href = '/'; // back to home
});

// Form submit (placeholder - we'll connect to backend later)
document.getElementById('requestForm').addEventListener('submit', (e) => {
e.preventDefault();
alert('Request submitted! (This will call backend later)');
// Here: call /api/shipment/request with token in headers
});
</script>
</body>
</html>
