<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Courier Dashboard - ZigaSwift</title>
<style>
:root {
--bg: #0b1220;
--card: #121a2c;
--text: #e7eefc;
--muted: #9ab0d6;
--accent: #2b76ff;
--success: #3ddc97;
--danger: #ff4d4d;
--border: #22304f;
--offline-bg: #2a2f3d;
--online-bg: #1a3a2a;
}

body {
background: var(--bg);
color: var(--text);
font-family: system-ui, -apple-system, sans-serif;
margin: 0;
padding: 20px;
line-height: 1.6;
}

.container { max-width: 1100px; margin: 0 auto; }

header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 40px;
}

h1 { margin: 0; font-size: 2.2rem; color: var(--text); }

.btn {
padding: 12px 24px;
background: var(--accent);
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
font-weight: 600;
transition: background 0.2s;
}

.btn:hover { background: #1f5ed8; }

.section {
background: var(--card);
border: 1px solid var(--border);
border-radius: 14px;
padding: 28px;
margin-bottom: 32px;
}

h2 {
margin-top: 0;
font-size: 1.5rem;
color: var(--success);
}

.profile-header {
display: flex;
align-items: center;
gap: 20px;
margin-bottom: 24px;
}

#profilePic {
width: 90px;
height: 90px;
border-radius: 50%;
object-fit: cover;
border: 3px solid var(--accent);
background: #0e1628;
}

.profile-form {
display: grid;
gap: 16px;
max-width: 500px;
}

input[type="text"],
input[type="number"],
input[type="file"] {
padding: 12px;
background: #0e1628;
border: 1px solid var(--border);
border-radius: 8px;
color: var(--text);
font-size: 1rem;
}

.stats-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 20px;
}

.stat-card {
background: #1a2742;
padding: 20px;
border-radius: 10px;
text-align: center;
border: 1px solid var(--border);
}

.stat-label {
font-size: 0.95rem;
color: var(--muted);
margin-bottom: 8px;
}

.stat-value {
font-size: 2rem;
font-weight: bold;
color: var(--accent);
}

/* ── Availability Toggle ── */
.availability-control {
display: flex;
flex-direction: column;
align-items: center;
gap: 12px;
}

.status-text {
font-size: 1.1rem;
font-weight: 600;
}

.status-online { color: var(--success); }
.status-offline { color: var(--danger); }

/* Toggle Switch Styles */
.switch {
position: relative;
display: inline-block;
width: 74px;
height: 38px;
}

.switch input {
opacity: 0;
width: 0;
height: 0;
}

.slider {
position: absolute;
cursor: pointer;
top: 0;
left: 0;
right: 0;
bottom: 0;
background-color: #4a5568;
transition: .4s;
border-radius: 38px;
}

.slider:before {
position: absolute;
content: "";
height: 30px;
width: 30px;
left: 4px;
bottom: 4px;
background-color: white;
transition: .4s;
border-radius: 50%;
}

input:checked + .slider {
background-color: var(--accent);
}

input:checked + .slider:before {
transform: translateX(36px);
}

/* Optional: labels inside slider (ON/OFF) */
.slider:after {
content: attr(data-status);
position: absolute;
top: 50%;
transform: translateY(-50%);
font-size: 0.85rem;
font-weight: bold;
color: white;
transition: all 0.4s;
}

input:not(:checked) + .slider:after {
left: 42px;
content: "OFF";
}

input:checked + .slider:after {
left: 12px;
content: "ON";
}

.shipment-card {
background: #1a2742;
padding: 20px;
border-radius: 10px;
margin-bottom: 20px;
border: 1px solid var(--border);
}

.shipment-card h3 {
margin: 0 0 12px;
color: var(--success);
font-size: 1.4rem;
}

.shipment-info {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 12px 20px;
margin-bottom: 16px;
font-size: 0.95rem;
color: var(--muted);
}

.shipment-info strong { color: var(--text); }

.action-btn {
padding: 10px 20px;
background: var(--success);
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
font-weight: 600;
transition: background 0.2s;
}

.action-btn:hover { background: #2eb57f; }

.empty-state {
text-align: center;
color: var(--muted);
padding: 60px 0;
font-size: 1.1rem;
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Courier Dashboard</h1>
<button class="btn" id="logout">Logout</button>
</header>

<!-- Courier Profile -->
<section class="section">
<h2>Your Profile</h2>
<div class="profile-header">
<img id="profilePic" src="https://via.placeholder.com/90?text=You" alt="Your Profile Picture">
<div>
<h3 id="courierName">Your Name</h3>
<p id="courierEmail" style="margin:6px 0 0; color:var(--muted);">your.email@example.com</p>
</div>
</div>

<div class="profile-form">
<label>
Update Name:
<input type="text" id="nameInput" placeholder="Your full name">
</label>
<label>
Update Profile Picture:
<input type="file" id="picInput" accept="image/*">
</label>
<button class="btn" id="saveProfile">Save Profile Changes</button>
</div>
</section>

<!-- Stats & Availability -->
<section class="section">
<h2>Your Stats & Availability</h2>
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">Current Tier</div>
<div class="stat-value" id="tier">Bronze</div>
</div>

<!-- Availability Toggle Card -->
<div class="stat-card" style="grid-column: span 2; text-align:center;">
<div class="stat-label">Go Online to Accept Deliveries</div>
<div class="availability-control">
<label class="switch">
<input type="checkbox" id="availabilityToggle">
<span class="slider" data-status="OFF"></span>
</label>
<div id="statusMessage" class="status-text status-offline">
You are currently Offline
</div>
</div>
</div>

<div class="stat-card">
<div class="stat-label">Available Capacity</div>
<div style="display:flex; align-items:center; gap:12px; justify-content:center;">
<input type="number" id="capacityInput" min="0" step="0.1" style="width:90px; text-align:center; font-size:1.4rem; color:var(--accent);">
<span style="font-size:1.4rem; color:var(--accent);">kg</span>
</div>
<button class="btn" id="saveCapacity" style="margin-top:12px; font-size:0.9rem; padding:8px 16px;">Update Capacity</button>
</div>

<div class="stat-card">
<div class="stat-label">Deliveries Completed</div>
<div class="stat-value" id="deliveries">0</div>
</div>

<div class="stat-card">
<div class="stat-label">Rating</div>
<div class="stat-value" id="rating">N/A</div>
</div>
</div>
</section>

<!-- Available Shipments -->
<section class="section">
<h2>Available Shipments</h2>
<div id="shipmentsList" class="empty-state">
Loading available shipments...
</div>
</section>
</div>

<script>
// ── Logout ──
document.getElementById('logout').addEventListener('click', () => {
localStorage.removeItem('jwtToken');
window.location.href = '/';
});

// ── Profile ──
const profilePic = document.getElementById('profilePic');
const courierNameEl = document.getElementById('courierName');
const nameInput = document.getElementById('nameInput');
const picInput = document.getElementById('picInput');
const saveProfileBtn = document.getElementById('saveProfile');

function loadProfile() {
const savedName = localStorage.getItem('courierName') || 'Your Name';
const savedPic = localStorage.getItem('courierPic') || 'https://via.placeholder.com/90?text=You';
courierNameEl.textContent = savedName;
nameInput.value = savedName;
profilePic.src = savedPic;
}
loadProfile();

saveProfileBtn.addEventListener('click', () => {
const newName = nameInput.value.trim();
if (newName) {
localStorage.setItem('courierName', newName);
courierNameEl.textContent = newName;
}
if (picInput.files?.[0]) {
const reader = new FileReader();
reader.onload = e => {
localStorage.setItem('courierPic', e.target.result);
profilePic.src = e.target.result;
};
reader.readAsDataURL(picInput.files[0]);
}
alert('Profile updated successfully!');
});

// ── Capacity ──
const capacityInput = document.getElementById('capacityInput');
const saveCapacityBtn = document.getElementById('saveCapacity');

function loadCapacity() {
const saved = localStorage.getItem('courierCapacity') || '8';
capacityInput.value = saved;
}
loadCapacity();

saveCapacityBtn.addEventListener('click', () => {
const newCapacity = parseFloat(capacityInput.value) || 0;
if (newCapacity >= 0) {
localStorage.setItem('courierCapacity', newCapacity);
alert(`Available capacity updated to ${newCapacity} kg`);
} else {
alert('Please enter a valid number (0 or higher)');
}
});

// ── Availability Toggle ──
const toggle = document.getElementById('availabilityToggle');
const statusMessage = document.getElementById('statusMessage');

function updateStatus() {
const isOnline = toggle.checked;
localStorage.setItem('courierOnline', isOnline);

if (isOnline) {
statusMessage.textContent = "You are currently Online – accepting deliveries";
statusMessage.className = "status-text status-online";
} else {
statusMessage.textContent = "You are currently Offline";
statusMessage.className = "status-text status-offline";
}

// Optional: hide/show shipments when offline (uncomment if desired)
// document.querySelector('.section:nth-child(4)').style.display = isOnline ? 'block' : 'none';
}

function loadAvailability() {
const saved = localStorage.getItem('courierOnline') === 'true';
toggle.checked = saved;
updateStatus();
}

toggle.addEventListener('change', updateStatus);
loadAvailability();

// ── Sample shipments (replace with real API later) ──
const shipments = [
{
title: "Small Electronics Package",
dispatchDate: "2026-02-12",
pickup: "Houston, TX 77002",
dropoff: "Austin, TX 78701",
weightNeeded: "2.4 kg",
estimatedPay: "$48"
},
{
title: "Important Documents",
dispatchDate: "2026-02-13",
pickup: "Dallas, TX 75201",
dropoff: "San Antonio, TX 78205",
weightNeeded: "0.9 kg",
estimatedPay: "$36"
}
];

function renderShipments() {
const list = document.getElementById('shipmentsList');
if (shipments.length === 0) {
list.innerHTML = '<div class="empty-state">No matching shipments available yet.</div>';
return;
}
list.innerHTML = '';
shipments.forEach(s => {
const card = document.createElement('div');
card.className = 'shipment-card';
card.innerHTML = `
<h3>${s.title}</h3>
<div class="shipment-info">
<div><strong>Dispatch Date:</strong> ${s.dispatchDate}</div>
<div><strong>Dispatch Location:</strong> ${s.pickup}</div>
<div><strong>Dropoff Location:</strong> ${s.dropoff}</div>
<div><strong>Weight Needed:</strong> ${s.weightNeeded}</div>
</div>
<button class="action-btn">Accept (${s.estimatedPay})</button>
`;
list.appendChild(card);
});
}
renderShipments();

// TODO: Replace with real API + only show if online
// async function fetchShipments() { ... }
</script>
</body>
</html>
