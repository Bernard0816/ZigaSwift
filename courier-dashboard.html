<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Courier Dashboard - ZigaSwift</title>
<link rel="stylesheet" href="styles.css" />
<style>
body { background: #0b1220; color: #e7eefc; font-family: system-ui, sans-serif; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
h1 { margin: 0; }
.btn { padding: 10px 20px; background: #2b76ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
.btn:hover { background: #1f5ed8; }
.section { background: #121a2c; border: 1px solid #22304f; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.shipment-card { background: #1a2742; padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #22304f; }
.shipment-card h3 { margin: 0 0 8px; color: #3ddc97; }
.shipment-card button { margin-top: 12px; padding: 8px 16px; background: #1f9d67; color: white; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Courier Dashboard</h1>
<div>
<button class="btn" id="logout">Logout</button>
</div>
</header>

<!-- Available shipments -->
<section class="section">
<h2>Available Shipments</h2>
<div id="shipmentsList">
<!-- Shipments will appear here as cards -->
<p>No available shipments matching your routes yet.</p>
</div>
</section>

<!-- Your stats / tier (placeholder) -->
<section class="section">
<h2>Your Stats</h2>
<p>Current Tier: <strong>Bronze</strong></p>
<p>Max Capacity: 5 kg per trip</p>
<p>Deliveries Completed: 0</p>
<p>Rating: N/A</p>
</section>
</div>

<script>
// Logout
document.getElementById('logout').addEventListener('click', () => {
localStorage.removeItem('jwtToken');
window.location.href = '/';
});

// Placeholder: later fetch from /api/courier/available-shipments
</script>
</body>
</html>
