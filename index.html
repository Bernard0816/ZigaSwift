<style>
.modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.8);
display: flex;
align-items: center;
justify-content: center;
z-index: 1000;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s;
}
.modal.open { opacity: 1; pointer-events: auto; }
.modal-content {
background: var(--card);
padding: 24px;
border-radius: 12px;
max-width: 400px;
width: 90%;
position: relative;
}
.close-modal {
position: absolute;
top: 12px;
right: 12px;
background: none;
border: none;
color: var(--muted);
font-size: 1.5rem;
cursor: pointer;
}
.toggle-form { text-align: center; margin-top: 16px; color: var(--muted); }
.toggle-form a { color: var(--btn); cursor: pointer; }
.logged-in { display: flex; align-items: center; gap: 12px; }
.logout { background: none; border: none; color: var(--muted); cursor: pointer; }
</style>

<!-- NEW: Sign In/Register Modal -->
<div id="authModal" class="modal">
<div class="modal-content">
<button class="close-modal" id="closeModal">&times;</button>
<h2 id="modalTitle">Sign In</h2>
<form id="authForm">
<label for="name">Full Name (for register)</label>
<input type="text" id="name" placeholder="Jane Doe" style="display:none;" />

<label for="email">Email</label>
<input type="email" id="email" placeholder="jane@email.com" required />

<label for="password">Password</label>
<input type="password" id="password" placeholder="At least 6 characters" required />

<label for="role" style="display:none;">Role</label>
<select id="role" style="display:none;">
<option value="sender">Sender</option>
<option value="courier">Courier</option>
</select>

<button type="submit" id="authSubmit">Sign In</button>
</form>
<p class="toggle-form">Don't have an account? <a id="toggleRegister">Register</a></p>
<p id="authMessage" class="form-msg"></p>
</div>
</div>

<!-- Your existing main content here (hero, sections, etc.) -->
</main>

<!-- Your existing footer -->
</footer>

<script src="script.js"></script>
<!-- NEW: Auth JS -->
<script>
const backendUrl = 'https://zigaswift-backend-1.onrender.com'; // Change to your main backend

const authModal = document.getElementById('authModal');
const closeModal = document.getElementById('closeModal');
const signInBtn = document.getElementById('signInBtn');
const authForm = document.getElementById('authForm');
const modalTitle = document.getElementById('modalTitle');
const authSubmit = document.getElementById('authSubmit');
const toggleRegister = document.getElementById('toggleRegister');
const nameInput = document.getElementById('name');
const roleSelect = document.getElementById('role');
const authMessage = document.getElementById('authMessage');
const authSection = document.getElementById('authSection');

let isRegister = false;

function openModal(register = false) {
isRegister = register;
modalTitle.textContent = register ? 'Register' : 'Sign In';
authSubmit.textContent = register ? 'Register' : 'Sign In';
toggleRegister.textContent = register ? 'Sign In' : 'Register';
nameInput.style.display = register ? 'block' : 'none';
roleSelect.style.display = register ? 'block' : 'none';
authModal.classList.add('open');
}

function closeAuthModal() {
authModal.classList.remove('open');
authMessage.textContent = '';
}

signInBtn.addEventListener('click', () => openModal(false));

closeModal.addEventListener('click', closeAuthModal);
toggleRegister.addEventListener('click', () => openModal(!isRegister));

authForm.addEventListener('submit', async (e) => {
e.preventDefault();
authSubmit.disabled = true;

const payload = {
email: document.getElementById('email').value,
password: document.getElementById('password').value,
};

if (isRegister) {
payload.name = document.getElementById('name').value;
payload.role = document.getElementById('role').value;
}

try {
const res = await fetch(`${backendUrl}/api/${isRegister ? 'register' : 'login'}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload),
});

const data = await res.json();
if (!data.ok) throw new Error(data.error || 'Failed');

localStorage.setItem('jwtToken', data.token);
closeAuthModal();
updateAuthSection();
} catch (err) {
authMessage.textContent = err.message;
authMessage.style.color = 'red';
} finally {
authSubmit.disabled = false;
}
});

function updateAuthSection() {
const token = localStorage.getItem('jwtToken');
if (token) {
authSection.innerHTML = `
<span>Welcome!</span>
<a href="${localStorage.getItem('role') === 'courier' ? 'courier-dashboard.html' : 'sender-dashboard.html'}">Dashboard</a>
<button class="logout" id="logoutBtn">Logout</button>
`;
document.getElementById('logoutBtn').addEventListener('click', () => {
localStorage.removeItem('jwtToken');
updateAuthSection();
});
} else {
authSection.innerHTML = `<button class="btn btn-sm btn-ghost" id="signInBtn">Sign In</button>`;
document.getElementById('signInBtn').addEventListener('click', () => openModal(false));
}
}

// Check on load
updateAuthSection();
</script>
</body>
